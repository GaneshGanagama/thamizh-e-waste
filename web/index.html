  <!-- ══════════════════════════════════════════════════════════
       FLUTTER BOOTSTRAP
  ══════════════════════════════════════════════════════════ -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    /* Loading screen shown before Flutter initialises */
    #loading-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    .loader-brand {
      font-size: 28px;
      font-weight: 700;
      color: #2e7d32;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #c8e6c9;
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>

  <!-- ── Native loading splash (replaced by Flutter once ready) ── -->
  <div id="loading-screen" aria-label="Loading Ecomeel">
    <img class="loader-logo"
         src="assets/images/logo.jpg"
         alt="Ecomeel logo"
         onerror="this.style.display='none'" />
    <div class="loader-brand">Ecomeel</div>
    <div class="spinner"></div>
  </div>

  <!-- Flutter entrypoint -->
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide loading screen once Flutter signals readiness.
    // NOTE: "Made with ♥ by Ganesh Gangama" is rendered ONLY by the
    // Flutter _FooterSection widget (home_screen.dart). Do not add an
    // HTML/CSS credit bar here — it will duplicate that footer and,
    // if fixed-positioned, collide with SnackBar/error toasts.
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function () { loader.remove(); }, 500);
      }
    });
  </script>

</body>
