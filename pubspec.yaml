name: thamizh
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:  
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # 🔥 Firebase Dependencies
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_messaging: ^15.2.9
  firebase_storage: ^12.4.9

  # 📍 Location and Map
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0
  geocoding: ^3.0.0
  location: ^6.0.2        # 👈 NEW: For real-time location tracking
  flutter_polyline_points: ^2.0.0 # 👈 NEW: To draw path on maps

  # 🌍 Internationalization
  intl: ^0.20.2

  # 📦 Useful Plugins
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  carousel_slider: ^5.1.1

  # 🧭 State Management & Admin Panel (Optional)
  provider: ^6.1.2         # 👈 Optional, if using state management

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/THAMIZH-01.jpg
    - assets/images/THAMIZH-02.jpg
    - assets/images/THAMIZH-03.jpg
    - assets/images/THAMIZH-03B.jpg
    - assets/images/THAMIZH-04.jpg

