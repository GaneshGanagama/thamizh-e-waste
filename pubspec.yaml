name: ecomeel
description: "Ecomeel - E-Waste Recycling & Pickup Service."
publish_to: 'none'

version: 1.0.4+5

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.1.1

  # Auth & Biometrics
  local_auth: ^3.0.1
  google_sign_in: ^6.2.1

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  firebase_storage: ^13.4.3

  # Supabase
  supabase_flutter: ^2.8.4

  # Location & Maps
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  google_maps_flutter: ^2.10.0
  flutter_polyline_points: ^3.1.0

  # Image & Media
  image_picker: ^1.1.2
  # flutter_image_compress removed — was version 1.1.3 which breaks AGP 8
  # use image_picker with readAsBytes() instead — already done in our code

  # Utilities
  url_launcher: ^6.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # PDF & Certificates
  pdf: ^3.11.1
  printing: ^5.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/logo.png
    - assets/images/THAMIZH-01.png
    - assets/images/THAMIZH-02.png
    - assets/images/THAMIZH-03.png
    - assets/images/THAMIZH-04.png
    - assets/images/logo1.jpg
    - assets/images/thamizh_ewaste_page1_img1.jpg
    - assets/images/thamizh_ewaste_page2_img2.jpg
    - assets/images/thamizh_ewaste_page3_img3.jpg